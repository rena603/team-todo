async function ttInitSeedData(){
  if(!TT.clients)TT.clients=[];
  if(!TT.projects)TT.projects=[];
  // Try to load from Google Sheets first
  const loaded=await ttFetchClientsFromSheet();
  if(loaded&&TT.clients.length>0){render();return;}
  // If sheet is empty, seed from TOGGL_SEED and push to sheet
  if(TT.clients.length===0){
    const rid=()=>'c'+Date.now()+Math.random().toString(36).slice(2,8);
    const pid=()=>'p'+Date.now()+Math.random().toString(36).slice(2,8);
    Object.entries(TOGGL_SEED).forEach(([client,projs])=>{
      const cid=rid();
      TT.clients.push({id:cid,name:client});
      projs.forEach(p=>{TT.projects.push({id:pid(),name:p,clientId:cid});});
    });
    const seedNames=new Set(Object.keys(TOGGL_SEED));
    [...S.work,...S.app].forEach(t=>{if(t.project&&!seedNames.has(t.project)&&!TT.clients.find(c=>c.name===t.project)){TT.clients.push({id:rid(),name:t.project});}});
    TT.entries.forEach(e=>{if(e.client&&!TT.clients.find(c=>c.name===e.client)){TT.clients.push({id:rid(),name:e.client});}});
    svTT();
    // Push seed data to sheet
    ttSyncClientsToSheet();
  }
}

  // 3. Member management — based on TEAM constant with JPY rates
  h+=`<div class="manage-card"><h4>メンバー管理 <span class="cnt">${TEAM.length}</span></h4>`;

  });
  h+=`</div></div>`;

  h+=`</div></div>`;
  el.innerHTML=h;
}

function ttCalWeekDates(){
  const d=new Date();d.setDate(d.getDate()+TT.calOffset*7);
  const day=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));
  const days=[];
  for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);days.push(dd);}
  return days;
}

function renderCalendarWeek(entries){
  const days=ttCalWeekDates();
  const weekEntries=entries.filter(e=>days.some(d=>ttDateStr(d)===e.startDate));
  const dayNames=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const hours=[];for(let h=8;h<=22;h++)hours.push(h);
  const dayEntries={};
  days.forEach((d,i)=>{dayEntries[i]=weekEntries.filter(e=>e.startDate===ttDateStr(d));});

  let calHtml=`<div class="tt-cal-hdr" style="border-right:1px solid var(--border-light)"></div>`;
  days.forEach((d,i)=>{
    const isT=ttIsToday(d);
    const daySec=dayEntries[i].reduce((s,e)=>s+e.duration,0);
    calHtml+=`<div class="tt-cal-hdr ${isT?'today-col':''}">${dayNames[i]}<br><strong style="font-size:20px;${isT?'color:var(--accent)':''}">${d.getDate()}</strong><br><span class="tt-day-total ${daySec>0?'has-time':''}">${daySec>0?ttFmt(daySec):'-'}</span></div>`;
  });

  hours.forEach(h=>{
    calHtml+=`<div class="tt-cal-time">${h}:00</div>`;
    days.forEach((d,i)=>{
      const hEntries=dayEntries[i].filter((_,idx)=>{
        const totalForDay=dayEntries[i].length;
        const hourSlot=8+Math.floor(idx/(totalForDay||1)*(hours.length-1));
        return hourSlot===h;
      });
      let cellHtml='';
      hEntries.forEach(e=>{
        const pc=projColor(e.project||e.task);
        const hh=Math.max(Math.round(e.duration/3600*48),20);
        cellHtml+=`<div class="tt-entry" style="background:${pc.bg};border-color:${pc.main};height:${hh}px;color:${pc.pbTx}" title="${e.desc||e.task} ${ttFmt(e.duration)}">
          ${e.desc||e.task||'-'}<br><span class="tt-entry-dur">${ttFmt(e.duration)}</span>
        </div>`;
      });
      calHtml+=`<div class="tt-cal-cell">${cellHtml}</div>`;
    });
  });

  return`<div class="tt-cal">${calHtml}</div>`;
}

function renderCalendarMonth(entries){
  const now=new Date();
  const month=new Date(now.getFullYear(),now.getMonth()+TT.calOffset,1);
  const year=month.getFullYear(),mo=month.getMonth();
  const firstDay=(new Date(year,mo,1).getDay()+6)%7; // 0=Mon
  const daysInMonth=new Date(year,mo+1,0).getDate();
  const daysInPrev=new Date(year,mo,0).getDate();
  const todayStr=ttDateStr(new Date());
  const dayNames=['月','火','水','木','金','土','日'];

  // Filter entries for this month
  const monthStart=ttDateStr(new Date(year,mo,1));
  const monthEnd=ttDateStr(new Date(year,mo+1,0));
  const monthEntries=entries.filter(e=>e.startDate>=monthStart&&e.startDate<=monthEnd);
  const byDate={};
  monthEntries.forEach(e=>{if(!byDate[e.startDate])byDate[e.startDate]=[];byDate[e.startDate].push(e);});

  let h='';
  dayNames.forEach(d=>{h+=`<div class="tt-cal-month-hdr">${d}</div>`;});

  // Fill grid: prev month padding + current month + next month padding
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    let dayNum,dateStr,isOtherMonth=false;
    if(i<firstDay){
      dayNum=daysInPrev-firstDay+i+1;
      const prevMonth=new Date(year,mo-1,dayNum);
      dateStr=ttDateStr(prevMonth);isOtherMonth=true;
    } else if(i-firstDay>=daysInMonth){
      dayNum=i-firstDay-daysInMonth+1;
      const nextMonth=new Date(year,mo+1,dayNum);
      dateStr=ttDateStr(nextMonth);isOtherMonth=true;
    } else {
      dayNum=i-firstDay+1;
      dateStr=ttDateStr(new Date(year,mo,dayNum));
    }
    const isToday=dateStr===todayStr;
    const dayEntries=byDate[dateStr]||[];
    const daySec=dayEntries.reduce((s,e)=>s+e.duration,0);
    const cls=['tt-cal-month-cell'];
    if(isOtherMonth)cls.push('other-month');
    if(isToday)cls.push('today-cell');

    h+=`<div class="${cls.join(' ')}">`;
    h+=`<div class="day-num">${dayNum}</div>`;
    dayEntries.slice(0,3).forEach(e=>{
      const pc=projColor(e.project||e.task);
      h+=`<div class="tt-cal-month-entry" style="background:${pc.bg};border-color:${pc.main};color:${pc.pbTx}">${e.desc||e.task||'-'}</div>`;
    });
    if(dayEntries.length>3)h+=`<div style="font-size:9px;color:var(--text-3)">+${dayEntries.length-3}件</div>`;
    if(daySec>0)h+=`<div class="tt-cal-month-total">${ttFmt(daySec)}</div>`;
    h+=`</div>`;
  }

  return`<div class="tt-cal-month">${h}</div>`;
}

function renderCalendarYear(entries){
  const y=new Date().getFullYear()+TT.calOffset;
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let maxSec=0;
  const monthData=[];
  for(let m=0;m<12;m++){
    const s=`${y}-${String(m+1).padStart(2,'0')}-01`;
    const end=new Date(y,m+1,0);
    const en=ttDateStr(end);
    const me=entries.filter(e=>e.startDate>=s&&e.startDate<=en);
    const totalSec=me.reduce((s,e)=>s+e.duration,0);
    const billSec=me.filter(e=>e.billable).reduce((s,e)=>s+e.duration,0);
    const days=new Set(me.map(e=>e.startDate)).size;
    monthData.push({month:monthNames[m],totalSec,billSec,days,entries:me.length});
    if(totalSec>maxSec)maxSec=totalSec;
  }

  let h=`<table><thead><tr><th>月</th><th>合計時間</th><th>Billable</th><th>稼働日数</th><th>エントリ数</th><th style="min-width:200px">工数</th></tr></thead><tbody>`;
  monthData.forEach(d=>{
    const pct=maxSec>0?d.totalSec/maxSec*100:0;
    h+=`<tr>
      <td style="font-weight:600">${d.month}</td>
      <td style="font-weight:600;font-variant-numeric:tabular-nums">${ttFmt(d.totalSec)}</td>
      <td style="font-variant-numeric:tabular-nums">${ttFmt(d.billSec)}</td>
      <td>${d.days}日</td>
      <td>${d.entries}件</td>
      <td><div class="month-bar"><div class="month-bar-fill" style="width:${pct}%"></div></div></td>
    </tr>`;
  });
  h+=`</tbody></table>`;

  return`<div class="tt-cal-year">${h}</div>`;
}

if(!TT.rptRange)TT.rptRange='week';
if(!TT.rptOffset)TT.rptOffset=0;
if(!TT.rptFilterProject)TT.rptFilterProject='';
if(!TT.rptFilterTask)TT.rptFilterTask='';

function ttRptSetRange(r){TT.rptRange=r;TT.rptOffset=0;render();}
function ttRptNav(dir){TT.rptOffset+=dir;render();}
function ttRptReset(){TT.rptOffset=0;render();}
function ttRptSetProject(v){TT.rptFilterProject=v;render();}
function ttRptSetTask(v){TT.rptFilterTask=v;render();}

function ttRptPeriod(){
  const now=new Date();
  let start,end,label,bucketFn;
  if(TT.rptRange==='week'){
    const d=new Date(now);d.setDate(d.getDate()+TT.rptOffset*7);
    const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));
    start=new Date(mon);end=new Date(mon);end.setDate(end.getDate()+6);
    const wn=Math.ceil(((d-new Date(d.getFullYear(),0,1))/86400000+1)/7);
    label=`W${wn} · ${start.getMonth()+1}/${start.getDate()} - ${end.getMonth()+1}/${end.getDate()}`;
    bucketFn=e=>e.startDate;
  } else if(TT.rptRange==='month'){
    const m=new Date(now.getFullYear(),now.getMonth()+TT.rptOffset,1);
    start=new Date(m);end=new Date(m.getFullYear(),m.getMonth()+1,0);
    label=`${m.getFullYear()}年${m.getMonth()+1}月`;
    bucketFn=e=>e.startDate;
  } else if(TT.rptRange==='year'){
    const y=now.getFullYear()+TT.rptOffset;
    start=new Date(y,0,1);end=new Date(y,11,31);
    label=`${y}年`;
    bucketFn=e=>{const d=new Date(e.startDate);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
  }
  return{start,end,label,bucketFn};
}

function ttRptEntries(){
  const{start,end}=ttRptPeriod();
  let e=ttFilteredEntries();
  const s=ttDateStr(start),en=ttDateStr(end);
  e=e.filter(x=>x.startDate>=s&&x.startDate<=en);
  if(TT.rptFilterProject)e=e.filter(x=>x.project===TT.rptFilterProject);
  if(TT.rptFilterTask)e=e.filter(x=>x.task===TT.rptFilterTask);
  return e;
}

// ===== RENDER REPORT VIEW =====
function renderReport(){
  const el=document.getElementById('v-report');if(!el)return;
  const{start,end,label,bucketFn}=ttRptPeriod();
  const rptEntries=ttRptEntries();
  const allFiltered=ttFilteredEntries(); // for filter dropdown options

  const totalSec=rptEntries.reduce((s,e)=>s+e.duration,0);
  const billSec=rptEntries.filter(e=>e.billable).reduce((s,e)=>s+e.duration,0);
  const totalCost=rptEntries.reduce((s,e)=>s+ttCost(e.duration,e.hourlyRate),0);
  const uniqueDays=new Set(rptEntries.map(e=>e.startDate)).size;
  const avgDaily=uniqueDays?Math.round(totalSec/uniqueDays):0;

  // Bar chart data: bucket by period
  const buckets={};
  rptEntries.forEach(e=>{
    const k=bucketFn(e);
    if(!buckets[k])buckets[k]={bill:0,nonBill:0};
    if(e.billable)buckets[k].bill+=e.duration; else buckets[k].nonBill+=e.duration;
  });

  // Generate all bucket labels for the period
  let barData=[];
  const dayNames=['日','月','火','水','木','金','土'];
  if(TT.rptRange==='week'){
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const k=ttDateStr(d);const b=buckets[k]||{bill:0,nonBill:0};
      barData.push({label:`${dayNames[d.getDay()]}\n${d.getMonth()+1}/${d.getDate()}`,bill:b.bill,nonBill:b.nonBill,total:b.bill+b.nonBill});
    }
  } else if(TT.rptRange==='month'){
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const k=ttDateStr(d);const b=buckets[k]||{bill:0,nonBill:0};
      barData.push({label:`${d.getDate()}`,bill:b.bill,nonBill:b.nonBill,total:b.bill+b.nonBill});
    }
  } else if(TT.rptRange==='year'){
    for(let m=0;m<12;m++){
      const k=`${start.getFullYear()}-${String(m+1).padStart(2,'0')}`;const b=buckets[k]||{bill:0,nonBill:0};
      barData.push({label:`${m+1}月`,bill:b.bill,nonBill:b.nonBill,total:b.bill+b.nonBill});
    }
  }
  const maxH=Math.max(...barData.map(d=>d.total),3600)/3600;

  // Project distribution (pie)
  const projMap={};
  rptEntries.forEach(e=>{const p=e.project||'(なし)';projMap[p]=(projMap[p]||0)+e.duration;});
  const projData=Object.entries(projMap).sort((a,b)=>b[1]-a[1]);
  const pieColors=['#7c3aed','#3b82f6','#22c55e','#ec4899','#f59e0b','#14b8a6','#ef4444','#6366f1','#d946ef','#84cc16'];

  // Breakdown by project + task
  const breakdown={};
  rptEntries.forEach(e=>{
    const key=`${e.project||'(なし)'}|||${e.task||e.desc||'(なし)'}`;
    if(!breakdown[key])breakdown[key]={project:e.project||'(なし)',task:e.task||e.desc||'(なし)',duration:0,cost:0};
    breakdown[key].duration+=e.duration;
    breakdown[key].cost+=ttCost(e.duration,e.hourlyRate);
  });
  const bdRows=Object.values(breakdown).sort((a,b)=>b.duration-a.duration);

  // Filter options
  const projectOpts=[...new Set(allFiltered.map(e=>e.project).filter(Boolean))].sort();
  const taskOpts=[...new Set(allFiltered.map(e=>e.task).filter(Boolean))].sort();

  const rangeBtn=(r,l)=>`<button class="tt-rng-btn ${TT.rptRange===r?'on':''}" onclick="ttRptSetRange('${r}')">${l}</button>`;

  el.innerHTML=`<div class="tt-rpt">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <button class="tt-week-nav" onclick="ttRptNav(-1)">&#8249;</button>
      <button class="tt-week-nav" onclick="ttRptNav(1)">&#8250;</button>
      <span class="tt-week-label">${label}</span>
      ${TT.rptOffset!==0?`<button class="tt-week-nav" onclick="ttRptReset()" style="font-size:11px">今期</button>`:''}
      <div style="display:flex;gap:1px;background:var(--surface2);border-radius:8px;padding:3px;margin-left:12px;border:1px solid var(--border)">
        ${rangeBtn('week','週')}${rangeBtn('month','月')}${rangeBtn('year','年')}
      </div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <select class="tt-filter-sel" onchange="ttRptSetProject(this.value)">
          <option value="">全プロジェクト</option>
          ${projectOpts.map(p=>`<option value="${p}" ${TT.rptFilterProject===p?'selected':''}>${p}</option>`).join('')}
        </select>
        <select class="tt-filter-sel" onchange="ttRptSetTask(this.value)">
          <option value="">全タスク</option>
          ${taskOpts.map(t=>`<option value="${t}" ${TT.rptFilterTask===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="tt-rpt-summary">
      <div class="tt-rpt-card"><h4>合計時間</h4><div class="val">${ttFmt(totalSec)}</div></div>
      <div class="tt-rpt-card"><h4>Billable</h4><div class="val">${ttFmt(billSec)} (${totalSec?Math.round(billSec/totalSec*100):0}%)</div></div>
      <div class="tt-rpt-card"><h4>コスト</h4><div class="val">¥${totalCost.toLocaleString()}</div></div>
      <div class="tt-rpt-card"><h4>日平均</h4><div class="val">${avgDaily?ttFmt(avgDaily):'-'}</div></div>
    </div>
    <div class="tt-charts">
      <div class="tt-chart-box">
        <h4>期間別工数</h4>
        <div class="tt-bar-chart" style="${barData.length>15?'gap:2px':''}">
          ${barData.map(d=>{
            const bH=maxH>0?d.bill/3600/maxH*180:0;
            const nbH=maxH>0?d.nonBill/3600/maxH*180:0;
            return`<div class="tt-bar-col">
              <div class="tt-bar-val">${d.total>0?ttFmt(d.total):''}</div>
              <div style="display:flex;flex-direction:column-reverse;width:100%">
                <div class="tt-bar" style="height:${bH}px;background:var(--accent);${nbH<=0?'border-radius:6px 6px 0 0':'border-radius:0'}"></div>
                ${nbH>0?`<div class="tt-bar" style="height:${nbH}px;background:var(--pink);border-radius:6px 6px 0 0"></div>`:''}
              </div>
              <div class="tt-bar-label" style="${barData.length>15?'font-size:8px':''}">${d.label.replace('\n','<br>')}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:11px;color:var(--text-3)">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--pink);vertical-align:middle;margin-right:4px"></span>Non-billable</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:4px"></span>Billable</span>
        </div>
      </div>
      <div class="tt-chart-box">
        <h4>プロジェクト別分布</h4>
        <div class="tt-pie-wrap">
          <canvas class="tt-pie" id="ttPie" width="180" height="180"></canvas>
          <div class="tt-pie-legend">
            ${projData.slice(0,10).map(([p,dur],i)=>`<div class="tt-pie-item">
              <span class="tt-pie-dot" style="background:${pieColors[i%pieColors.length]}"></span>
              <span>${p}</span>
              <span class="tt-pie-pct">${totalSec?Math.round(dur/totalSec*100):0}%</span>
            </div>`).join('')}
            ${projData.length>10?`<div class="tt-pie-item" style="color:var(--text-3)">...他${projData.length-10}件</div>`:''}
          </div>
        </div>
      </div>
    </div>
    <div class="tt-breakdown">
      <table>
        <thead><tr><th>プロジェクト / タスク</th><th>時間</th><th>割合</th><th>コスト</th></tr></thead>
        <tbody>
          ${bdRows.map(r=>`<tr>
            <td><strong>${r.project}</strong> / ${r.task}</td>
            <td>${ttFmt(r.duration)}</td>
            <td>${totalSec?Math.round(r.duration/totalSec*100):0}%</td>
            <td>¥${r.cost.toLocaleString()}</td>
          </tr>`).join('')}
          ${bdRows.length===0?'<tr><td colspan="4" style="text-align:center;color:var(--text-3);padding:24px">データがありません</td></tr>':''}
        </tbody>
      </table>
    </div>
  </div>`;

  // Draw pie chart
  setTimeout(()=>{
    const canvas=document.getElementById('ttPie');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const cx=90,cy=90,r=80,ir=50;
    ctx.clearRect(0,0,180,180);
    if(!projData.length){ctx.fillStyle='#e8ebf0';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();return;}
    let startAngle=-Math.PI/2;
    projData.forEach(([,dur],i)=>{
      const slice=dur/totalSec*Math.PI*2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,startAngle,startAngle+slice);ctx.fillStyle=pieColors[i%pieColors.length];ctx.fill();
      startAngle+=slice;
    });
    ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    ctx.fillStyle='#1a1d23';ctx.font='bold 14px Inter';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ttFmt(totalSec),cx,cy-6);
    ctx.font='10px Inter';ctx.fillStyle='#9da3ae';ctx.fillText('TOTAL',cx,cy+10);
  },50);
}

ldTT();fetchTimeEntries();

ld();ldRoutines();ttSyncClientsFromTasks();loadHash();render();updateHash();fetchSheet();fetchProjColors();
// Ensure timeline scrolls to today after initial paint
if(S.view==='timeline')setTimeout(()=>tlScrollToToday(),100);
</script>
</body>
</html>
